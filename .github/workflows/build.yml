name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", ".gitignore"]
  pull_request:
  workflow_dispatch:

# Batalkan build lama kalau ada push baru di branch yang sama
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # dibutuhkan hanya untuk step Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah terpasang di runner ubuntu-latest (ANDROID_HOME), jadi
      # android-actions/setup-android tidak dipakai (gagal: package 'tools' tidak ada).
      # Kalau SDK 34 belum ada, AGP mengunduhnya otomatis; lisensi diterima di bawah.
      - name: Terima lisensi SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Cache Gradle (dependency, wrapper, build cache); cache hanya ditulis dari main
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Tanda tangani APK dengan kunci uji AOSP milik ROM (UN1CA), supaya tanda
      # tangannya selalu sama di setiap build dan cocok dengan ROM kamu.
      # Kunci ini publik (ada di repo UN1CA, dipin ke satu commit); AGP memakainya
      # sebagai debug keystore (alias androiddebugkey, password android).
      - name: Pakai kunci uji AOSP UN1CA sebagai debug keystore
        env:
          UNICA_SHA: 0c2ea1d61ddc78ae8e6900787f9f9e7269b7b439
        run: |
          B=https://raw.githubusercontent.com/salvogiangri/UN1CA/$UNICA_SHA/security
          mkdir -p ~/.android /tmp/k
          curl -fsSL "$B/aosp_testkey.pk8"      -o /tmp/k/key.pk8
          curl -fsSL "$B/aosp_testkey.x509.pem" -o /tmp/k/cert.pem
          openssl pkcs8 -inform DER -nocrypt -in /tmp/k/key.pk8 -out /tmp/k/key.pem
          openssl pkcs12 -export -inkey /tmp/k/key.pem -in /tmp/k/cert.pem \
            -name androiddebugkey -out /tmp/k/debug.p12 -passout pass:android
          rm -f ~/.android/debug.keystore
          keytool -importkeystore -srckeystore /tmp/k/debug.p12 -srcstoretype PKCS12 \
            -srcstorepass android -destkeystore ~/.android/debug.keystore \
            -deststoretype PKCS12 -deststorepass android -alias androiddebugkey -noprompt
          rm -rf /tmp/k

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --console=plain --info

      - name: Siapkan nama APK
        id: apk
        run: |
          NAME="ZestIsland-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ZestIsland-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # Kalau build gagal, simpan laporan supaya gampang debug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Ringkasan
        run: |
          {
            echo "### Build selesai"
            echo "- File: \`${{ steps.apk.outputs.name }}\`"
            echo "- Ukuran: $(du -h '${{ steps.apk.outputs.name }}' | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Push tag v* (mis. v0.2) otomatis bikin GitHub Release berisi APK
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
