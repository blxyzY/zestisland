name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", ".gitignore"]
  pull_request:
  workflow_dispatch:

# Batalkan build lama kalau ada push baru di branch yang sama
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # dibutuhkan hanya untuk step Release
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Cache Gradle (dependency, wrapper, build cache); cache hanya ditulis dari main
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Debug keystore bawaan runner berbeda tiap build, jadi APK baru tidak bisa
      # menimpa yang lama (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Isi secret
      # DEBUG_KEYSTORE_BASE64 supaya tanda tangan selalu sama:
      #   base64 -w0 ~/.android/debug.keystore
      - name: Pakai debug keystore tetap (opsional)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Debug keystore tetap dipakai."
          else
            echo "::notice::DEBUG_KEYSTORE_BASE64 belum diset, tanda tangan APK akan berubah tiap build."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Siapkan nama APK
        id: apk
        run: |
          NAME="ZestIsland-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ZestIsland-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # Kalau build gagal, simpan laporan supaya gampang debug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Ringkasan
        run: |
          {
            echo "### Build selesai"
            echo "- File: \`${{ steps.apk.outputs.name }}\`"
            echo "- Ukuran: $(du -h '${{ steps.apk.outputs.name }}' | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Push tag v* (mis. v0.2) otomatis bikin GitHub Release berisi APK
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
